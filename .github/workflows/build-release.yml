name: Build and Release

# Triggered by pushing a version tag, e.g.: git tag v3.2.0 && git push origin v3.2.0
on:
  push:
    tags:
      - 'v[0-9]*'

# The release is created with RELEASE_PAT (see the last step), so the workflow token only reads.
permissions:
  contents: read
  actions: read  # SignPath reads this run and downloads the files to sign

jobs:
  build:
    # Visual Studio 2022 (17.x) builds the native module, matching the VC++ runtime PySide6 and
    # Python ship (scripts/build_native.ps1); windows-2025 runners no longer carry it.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # later steps hold RELEASE_PAT; no token stays in the git config

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      # Single source of truth: all metadata comes from pyproject.toml
      - name: Read app metadata
        id: meta
        shell: pwsh
        run: |
          . .\scripts\common.ps1
          $m = Get-AppMeta
          "VER=$($m.Version)"      | Out-File $env:GITHUB_OUTPUT -Append
          "APP_NAME=$($m.AppName)" | Out-File $env:GITHUB_OUTPUT -Append

      # Release files are named after pyproject's version and the release after the tag, so the
      # two must agree (and winget downloads by the tag's version).
      - name: Check the tag matches the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          if ($env:TAG -ne "v$env:VER") {
            Write-Error "Tag $env:TAG does not match pyproject.toml version (v$env:VER)."
            exit 1
          }

      # A local staging build points the updater at a test server and a test key
      # (scripts\bundle.ps1 -UpdateFeed); that file must never reach a release.
      - name: Check no staging update feed is present
        shell: pwsh
        run: |
          if (Test-Path gfglock\config\update_staging.py) {
            Write-Error "gfglock\config\update_staging.py is a local test file; delete it before releasing."
            exit 1
          }

      - name: Install Python dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      # vcpkg's binary cache holds the built OpenSSL package, and .vcpkg the pinned vcpkg tool.
      # The key follows the vcpkg manifest and commit and the CMake files; the same key in
      # tests.yml lets a release reuse what the default branch built.
      - name: Cache vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .vcpkg
            !.vcpkg/buildtrees
            !.vcpkg/packages
            !.vcpkg/downloads
            ${{ runner.temp }}\vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-commit.txt', 'native/CMakeLists.txt', 'native/CMakePresets.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Compiles gfglock_native.pyd and gfglock_shell.dll using MSVC + CMake.
      - name: Build native extension
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-archives
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          .\scripts\build_native.ps1

      # Runs after the native build so the native cipher, the Python fallback, and
      # cross-path decryption are all covered.
      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # Bundles the app into dist\gfgLock\ (onedir, used by both installers and the portable
      # .7z) and runs the frozen exe with --self-test: the native extension and its pinned
      # OpenSSL, every algorithm (native and Python fallback, both directions), and every QML
      # file. Anything missing from the bundle fails the release here.
      - name: Build and verify the app bundle
        shell: pwsh
        env:
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
        run: |
          . .\scripts\bundle.ps1
          $null = New-AppBundle -Name $env:APP_NAME -Mode onedir -DistPath "dist"

      # Code signing through SignPath (readme > Code Signing Policy) once the repository has the
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, and SIGNPATH_POLICY_SLUG variables and the
      # SIGNPATH_API_TOKEN secret; without them the release is unsigned. gfgLock.exe and the Explorer
      # extension are signed first, so the installers and the portable .7z ship signed copies.
      - name: Upload the programs for signing
        id: unsigned-programs
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-programs
          path: |
            dist/${{ steps.meta.outputs.APP_NAME }}/${{ steps.meta.outputs.APP_NAME }}.exe
            dist/${{ steps.meta.outputs.APP_NAME }}/bin/gfglock.exe
            build/shell/gfglock_shell.dll
          if-no-files-found: error

      # Waits up to two hours for the release's approval in SignPath, then puts the signed files in
      # place of the unsigned ones (the artifact keeps their paths from the repository root).
      - name: Sign the programs
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.unsigned-programs.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: .
          parameters: |
            version: ${{ toJSON(steps.meta.outputs.VER) }}

      # Pinned, so every release compiles with the same Inno Setup. "upgrade" with
      # --allow-downgrade installs exactly this version whether or not the image has another.
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.1 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed (exit $LASTEXITCODE)" }

      - name: Build installers
        shell: pwsh
        run: |
          . .\scripts\common.ps1
          $meta = Get-AppMeta
          foreach ($kind in "System", "User") { $null = Invoke-Iscc -Kind $kind -Meta $meta }

      # Single-file portable exe, verified the same way as the onedir bundle
      - name: Build and verify the portable exe
        shell: pwsh
        env:
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          . .\scripts\bundle.ps1
          $null = New-AppBundle -Name "${env:APP_NAME}_${env:VER}_portable" -Mode onefile -DistPath "build"

      - name: Upload the installers and portable exe for signing
        id: unsigned-packages
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-packages
          path: |
            build/installer/${{ steps.meta.outputs.APP_NAME }}_${{ steps.meta.outputs.VER }}_system_installer.exe
            build/installer/${{ steps.meta.outputs.APP_NAME }}_${{ steps.meta.outputs.VER }}_user_installer.exe
            build/${{ steps.meta.outputs.APP_NAME }}_${{ steps.meta.outputs.VER }}_portable.exe
          if-no-files-found: error

      # Signed before the update manifest lists their sizes and hashes.
      - name: Sign the installers and portable exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: packages
          github-artifact-id: ${{ steps.unsigned-packages.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: build
          parameters: |
            version: ${{ toJSON(steps.meta.outputs.VER) }}

      # The portable .7z is the onedir bundle (no extraction to a temp folder at each start) with
      # the marker that keeps its settings and logs beside it, and the licence texts.
      - name: Create the portable archive
        shell: pwsh
        env:
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          . .\scripts\bundle.ps1
          New-PortableArchive -BundleDir "dist\$env:APP_NAME" -ArchivePath "build\${env:APP_NAME}_${env:VER}_portable.7z"

      # update.json lists what the in-app updater installs (each installer and the portable exe,
      # with sizes and SHA-256 hashes) and is signed with UPDATE_SIGNING_KEY. --expect stops a
      # release signed with a key gfgLock doesn't carry, which no installed copy could verify.
      # The portable .7z isn't listed: that copy can't replace itself and links to the release.
      - name: Write and sign the update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          $base = "${env:APP_NAME}_${env:VER}"
          python scripts\make_update_manifest.py --app $env:APP_NAME --version $env:VER `
            --repo $env:GITHUB_REPOSITORY --out build\update.json `
            --package "kind=system;files=build\installer\${base}_system_installer.exe" `
            --package "kind=user;files=build\installer\${base}_user_installer.exe" `
            --package "kind=portable-exe;files=build\${base}_portable.exe"
          if ($LASTEXITCODE -ne 0) { throw "make_update_manifest.py failed (exit $LASTEXITCODE)" }
          python scripts\sign_update.py build\update.json --expect gfglock\config\defaults.py
          if ($LASTEXITCODE -ne 0) { throw "sign_update.py failed (exit $LASTEXITCODE)" }

      # Creates and publishes the GitHub Release with its four assets and the signed update
      # manifest. Must use RELEASE_PAT (not GITHUB_TOKEN) - events fired by GITHUB_TOKEN
      # do not cascade into other workflows, so winget-release.yml would never trigger.
      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ github.ref_name }}
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          $base = "${env:APP_NAME}_${env:VER}"
          # Every release page links the code signing policy, as SignPath's terms ask.
          $notes = "build\release_notes.md"
          $policy = "https://github.com/$env:GITHUB_REPOSITORY#code-signing-policy"
          $text = (Get-Content -Raw "release_notes/release_notes_v$env:VER.md").TrimEnd()
          Set-Content -Path $notes -Encoding utf8NoBOM -Value "$text`n`n---`n`nCode signing policy: $policy"
          gh release create $env:TAG `
            --title "$env:APP_NAME v$env:VER" `
            --notes-file $notes `
            "build\installer\${base}_system_installer.exe" `
            "build\installer\${base}_user_installer.exe" `
            "build\${base}_portable.exe" `
            "build\${base}_portable.7z" `
            "build\update.json" `
            "build\update.json.sig"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
