name: Build and Release

# Triggered by pushing a version tag, e.g.: git tag v3.2.0 && git push origin v3.2.0
on:
  push:
    tags:
      - 'v[0-9]*'

# The release is created with RELEASE_PAT (see the last step), so the workflow token only reads.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # later steps hold RELEASE_PAT; no token stays in the git config

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      # Single source of truth: all metadata comes from pyproject.toml
      - name: Read app metadata
        id: meta
        shell: pwsh
        run: |
          . .\scripts\common.ps1
          $m = Get-AppMeta
          "VER=$($m.Version)"      | Out-File $env:GITHUB_OUTPUT -Append
          "APP_NAME=$($m.AppName)" | Out-File $env:GITHUB_OUTPUT -Append

      # Release files are named after pyproject's version and the release after the tag, so the
      # two must agree (and winget downloads by the tag's version).
      - name: Check the tag matches the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          if ($env:TAG -ne "v$env:VER") {
            Write-Error "Tag $env:TAG does not match pyproject.toml version (v$env:VER)."
            exit 1
          }

      - name: Install Python dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      # vcpkg's binary cache holds the built OpenSSL package, and .vcpkg the pinned vcpkg tool.
      # The key follows the vcpkg manifest and commit and the CMake files; the same key in
      # tests.yml lets a release reuse what the default branch built.
      - name: Cache vcpkg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .vcpkg
            !.vcpkg/buildtrees
            !.vcpkg/packages
            !.vcpkg/downloads
            ${{ runner.temp }}\vcpkg-archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-commit.txt', 'native/CMakeLists.txt', 'native/CMakePresets.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Compiles gfglock_native.pyd and gfglock_shell.dll using MSVC + CMake.
      - name: Build native extension
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-archives
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          .\scripts\build_native.ps1

      # Runs after the native build so the native cipher, the Python fallback, and
      # cross-path decryption are all covered.
      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # Bundles the app into dist\gfgLock\ (onedir, used by both installers and the portable
      # .7z) and runs the frozen exe with --self-test: the native extension and its pinned
      # OpenSSL, every algorithm (native and Python fallback, both directions), and every QML
      # file. Anything missing from the bundle fails the release here.
      - name: Build and verify the app bundle
        shell: pwsh
        env:
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
        run: |
          . .\scripts\bundle.ps1
          $null = New-AppBundle -Name $env:APP_NAME -Mode onedir -DistPath "dist"

      # Pinned, so every release compiles with the same Inno Setup. "upgrade" with
      # --allow-downgrade installs exactly this version whether or not the image has another.
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco upgrade innosetup --version=6.7.1 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed (exit $LASTEXITCODE)" }

      - name: Build installers
        shell: pwsh
        run: |
          . .\scripts\common.ps1
          $meta = Get-AppMeta
          foreach ($kind in "System", "User") { $null = Invoke-Iscc -Kind $kind -Meta $meta }

      # Single-file portable exe, verified the same way as the onedir bundle
      - name: Build and verify the portable exe
        shell: pwsh
        env:
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          . .\scripts\bundle.ps1
          $null = New-AppBundle -Name "${env:APP_NAME}_${env:VER}_portable" -Mode onefile -DistPath "build"

      # The portable .7z is the onedir bundle (no extraction to a temp folder at each start) with
      # the marker that keeps its settings and logs beside it, and the licence texts.
      - name: Create the portable archive
        shell: pwsh
        env:
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          . .\scripts\bundle.ps1
          New-PortableArchive -BundleDir "dist\$env:APP_NAME" -ArchivePath "build\${env:APP_NAME}_${env:VER}_portable.7z"

      # Creates and publishes the GitHub Release with its four assets.
      # Must use RELEASE_PAT (not GITHUB_TOKEN) - events fired by GITHUB_TOKEN
      # do not cascade into other workflows, so winget-release.yml would never trigger.
      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ github.ref_name }}
          APP_NAME: ${{ steps.meta.outputs.APP_NAME }}
          VER: ${{ steps.meta.outputs.VER }}
        run: |
          $base = "${env:APP_NAME}_${env:VER}"
          gh release create $env:TAG `
            --title "$env:APP_NAME v$env:VER" `
            --notes-file "release_notes/release_notes_v$env:VER.md" `
            "build\installer\${base}_system_installer.exe" `
            "build\installer\${base}_user_installer.exe" `
            "build\${base}_portable.exe" `
            "build\${base}_portable.7z"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
