name: Build and Release

# Triggered by pushing a version tag, e.g.: git tag v3.1.0 && git push origin v3.1.0
on:
  push:
    tags:
      - 'v[0-9]*'

# Needed so gh release create can upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Single source of truth: all metadata comes from pyproject.toml
      - name: Read app metadata
        id: meta
        shell: pwsh
        run: |
          $json = python scripts/read_meta.py
          $m    = $json | ConvertFrom-Json
          "VER=$($m.Version)"         | Out-File $env:GITHUB_OUTPUT -Append
          "APP_NAME=$($m.AppName)"    | Out-File $env:GITHUB_OUTPUT -Append
          "PUBLISHER=$($m.Publisher)" | Out-File $env:GITHUB_OUTPUT -Append
          "URL=$($m.Url)"             | Out-File $env:GITHUB_OUTPUT -Append
          "EXE_NAME=$($m.ExeName)"    | Out-File $env:GITHUB_OUTPUT -Append

      # Release files are named after pyproject's version and the release after the tag, so the
      # two must agree (and winget downloads by the tag's version).
      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $expected = "v${{ steps.meta.outputs.VER }}"
          if ("${{ github.ref_name }}" -ne $expected) {
            Write-Error "Tag ${{ github.ref_name }} does not match pyproject.toml version ($expected)."
            exit 1
          }

      - name: Install Python dependencies
        shell: pwsh
        run: pip install -r requirements.txt

      # Cache the vcpkg binary + installed OpenSSL/pybind11 packages.
      # Key tied to native/vcpkg.json and the pinned vcpkg commit, so either change busts the cache.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg
            native/vcpkg_installed
            native/build/vcpkg_installed
          key: vcpkg-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-commit.txt') }}

      # Compiles gfglock_native.pyd and gfglock_shell.dll using MSVC + CMake.
      - name: Build native extension
        shell: pwsh
        run: .\scripts\build_native.ps1

      # Runs after the native build so the native cipher, the Python fallback, and
      # cross-path decryption are all covered.
      - name: Run tests
        shell: pwsh
        run: python -m pytest -q
      - name: Create build output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path build\installer -Force | Out-Null

      # Bundles the Python app into dist\gfgLock\ (onedir - used by both installers).
      # scripts/bundle.ps1 holds the PyInstaller arguments shared with the local build scripts.
      - name: Build PyInstaller bundle
        shell: pwsh
        run: |
          . .\scripts\bundle.ps1
          $pyArgs = Get-PyInstallerArgs -Name "${{ steps.meta.outputs.APP_NAME }}" -Mode onedir -DistPath "dist"
          pyinstaller @pyArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed (exit $LASTEXITCODE)" }

      # Runs the frozen exe with --self-test: loads the native extension and its OpenSSL DLLs,
      # encrypts and decrypts with every algorithm (native and Python fallback, both directions),
      # and compiles all QML. Anything missing from the bundle fails the release here.
      - name: Verify PyInstaller bundle
        shell: pwsh
        run: |
          . .\scripts\bundle.ps1
          $appName = "${{ steps.meta.outputs.APP_NAME }}"
          if (-not (Test-Bundle "dist\$appName\$appName.exe")) { throw "Bundle self-test failed" }
      - name: Copy shell DLL into bundle
        shell: pwsh
        run: Copy-Item build\shell\gfglock_shell.dll dist\${{ steps.meta.outputs.APP_NAME }}\ -Force

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      # /D flags override the #ifndef defaults in the ISS files
      - name: Build system installer
        shell: pwsh
        run: |
          $ver       = "${{ steps.meta.outputs.VER }}"
          $appName   = "${{ steps.meta.outputs.APP_NAME }}"
          $publisher = "${{ steps.meta.outputs.PUBLISHER }}"
          $url       = "${{ steps.meta.outputs.URL }}"
          $iscc      = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DMyAppName=$appName" `
            "/DMyAppVersion=$ver" `
            "/DMyAppPublisher=$publisher" `
            "/DMyAppURL=$url" `
            installer\gfglock_system_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "System installer build failed (exit $LASTEXITCODE)" }

      - name: Build user installer
        shell: pwsh
        run: |
          $ver       = "${{ steps.meta.outputs.VER }}"
          $appName   = "${{ steps.meta.outputs.APP_NAME }}"
          $publisher = "${{ steps.meta.outputs.PUBLISHER }}"
          $url       = "${{ steps.meta.outputs.URL }}"
          $iscc      = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc `
            "/DMyAppName=$appName" `
            "/DMyAppVersion=$ver" `
            "/DMyAppPublisher=$publisher" `
            "/DMyAppURL=$url" `
            installer\gfglock_user_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "User installer build failed (exit $LASTEXITCODE)" }

      # Single-file portable exe, verified the same way as the onedir bundle
      - name: Build portable exe
        shell: pwsh
        run: |
          . .\scripts\bundle.ps1
          $portable = "${{ steps.meta.outputs.APP_NAME }}_${{ steps.meta.outputs.VER }}_portable"
          $pyArgs = Get-PyInstallerArgs -Name $portable -Mode onefile -DistPath "build"
          pyinstaller @pyArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller (portable) failed (exit $LASTEXITCODE)" }
          if (-not (Test-Bundle "build\$portable.exe")) { throw "Portable self-test failed" }
      # Pack all three EXEs into .7z archives for users who prefer compressed downloads.
      # The portable .7z also bundles the onedir app for direct-run without temp extraction.
      - name: Create 7z archives
        shell: pwsh
        run: |
          $ver     = "${{ steps.meta.outputs.VER }}"
          $appName = "${{ steps.meta.outputs.APP_NAME }}"
          $7z      = "C:\Program Files\7-Zip\7z.exe"

          & $7z a -t7z -mx=9 `
            "build\installer\${appName}_${ver}_system_installer.7z" `
            "build\installer\${appName}_${ver}_system_installer.exe"
          if ($LASTEXITCODE -ne 0) { throw "7z: system installer archive failed" }

          & $7z a -t7z -mx=9 `
            "build\installer\${appName}_${ver}_user_installer.7z" `
            "build\installer\${appName}_${ver}_user_installer.exe"
          if ($LASTEXITCODE -ne 0) { throw "7z: user installer archive failed" }

          # Portable .7z is the full onedir bundle - faster launch, no temp extraction
          & $7z a -t7z -mx=9 `
            "build\${appName}_${ver}_portable.7z" `
            "dist\${appName}\*"
          if ($LASTEXITCODE -ne 0) { throw "7z: portable bundle archive failed" }

      # Creates + publishes the GitHub Release, uploads all six assets.
      # Must use RELEASE_PAT (not GITHUB_TOKEN) - events fired by GITHUB_TOKEN
      # do not cascade into other workflows, so winget-release.yml would never trigger.
      - name: Create GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          $ver     = "${{ steps.meta.outputs.VER }}"
          $appName = "${{ steps.meta.outputs.APP_NAME }}"
          $tag     = "${{ github.ref_name }}"
          gh release create $tag `
            --title "$appName v$ver" `
            --notes-file "release_notes/release_notes_v${ver}.md" `
            "build\installer\${appName}_${ver}_system_installer.exe" `
            "build\installer\${appName}_${ver}_system_installer.7z" `
            "build\installer\${appName}_${ver}_user_installer.exe" `
            "build\installer\${appName}_${ver}_user_installer.7z" `
            "build\${appName}_${ver}_portable.exe" `
            "build\${appName}_${ver}_portable.7z"
